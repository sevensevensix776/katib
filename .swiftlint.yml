# SwiftLint config for Katib.
#
# Philosophy:
# - Enforce the rules that actually prevent bugs or make code readable.
# - Don't nag on style that comes down to taste or that the language is
#   already moving to handle (e.g. generated Equatable).
# - Keep the config readable. A 300-line style guide nobody reads isn't
#   worth its churn.

included:
  - Sources
  - Tests

excluded:
  - .build
  - .git
  - Katib.app
  - Sources/KatibDictation/Resources

# ---- Disabled (not carrying their weight) -----------------------------------

disabled_rules:
  - todo                         # We use `// TODO:` intentionally; not noise.
  - trailing_whitespace          # Git hooks handle this; swiftlint double-flags.
  - opening_brace                # Conflicts with SwiftUI view-builder style.
  - multiple_closures_with_trailing_closure  # SwiftUI pattern, fine.
  - type_name                    # Sometimes short generic names are fine.
  - attributes                   # Fights SwiftUI @MainActor on the same line.

# ---- Opt-in rules worth enabling -------------------------------------------

opt_in_rules:
  - array_init
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  # force_unwrapping removed — AppKit, AX APIs, and Foundation APIs regularly
  # return optionals where force-unwrap is the idiomatic choice (e.g.
  # `NSScreen.screens.first!` when we've already guarded count > 0).
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_random
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_in_static_references
  - prefer_zero_over_explicit_init
  - redundant_nil_coalescing
  - redundant_type_annotation
  - shorthand_optional_binding
  - single_test_class
  - sorted_first_last
  - toggle_bool
  - unused_import
  - yoda_condition

# ---- Tuned thresholds -------------------------------------------------------

line_length:
  warning: 140
  error: 200
  ignores_urls: true
  ignores_comments: true

file_length:
  warning: 700
  error: 1000
  ignore_comment_only_lines: true

function_body_length:
  warning: 80
  error: 150

type_body_length:
  # AppDelegate is coordination code and naturally long. A 600-line threshold
  # pushes us to premature extension-splitting that hurts readability. 1000
  # error threshold matches file_length, so both fire at the same scale.
  warning: 600
  error: 1000

cyclomatic_complexity:
  warning: 15
  error: 25

identifier_name:
  min_length: 1              # `let a = ...`, `for c in corrections` are fine.
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - ok
    - to
    - of
    - on
    - in
    - up
    - it
    - pb
    - e
    - a
    - b
    - c
    - f
    - p
    - q
    - r
    - s
    - t
    - x
    - y
    - z

# ---- Custom rules specific to Katib -----------------------------------------
# Things the core lint doesn't catch but we've been bitten by.

custom_rules:
  no_print_in_release:
    name: "No print() in release code"
    regex: '^\s*print\('
    message: "Use Logger.shared.log(...) instead of print() — lands in katib.log."
    severity: warning
    excluded: "Tests"

  no_force_try_outside_tests:
    name: "No force try outside tests"
    regex: 'try!\s'
    message: "Force try crashes the app. Handle the error or use try?."
    severity: warning
    excluded: "Tests"

reporter: "xcode"
