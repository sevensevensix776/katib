name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Katib uses macOS 26 APIs (SpeechAnalyzer), so it needs the macOS 26 SDK,
    # which ships with Xcode 26. macos-15 has Xcode 16 and cannot build it.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Swift version
        run: swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build -c debug

      - name: Test
        run: swift test

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        # Exit non-zero only on `error`-severity rules. Warnings surface as PR
        # annotations (github-actions-logging) but don't block merge.
        run: swiftlint lint --quiet --reporter github-actions-logging
